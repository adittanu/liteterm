[package]
name = "liteterm"
version = "1.8.2"
description = "A fast, lightweight SSH client"
authors = ["you"]
edition = "2021"
default-run = "liteterm"

[lib]
name = "liteterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
russh = "0.45"
russh-sftp = "2"
portable-pty = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Secrets live in the OS keyring. A platform whose backend feature is missing
# gets keyring's in-memory mock store: saving "works", and the next read finds
# nothing. So every target names its own backend.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Secret Service (GNOME Keyring, KWallet) over libdbus: building needs
# libdbus-1-dev, running needs a Secret Service daemon.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[patch.crates-io]
# Local fork: ConPTY passthrough (see vendor/.../psuedocon.rs).
portable-pty = { path = "vendor/portable-pty" }

[features]
# Diagnostic installer: `pnpm tauri build --features diag` keeps the WebView
# DevTools (F12) in a release build. Off by default, so the shipped installer
# is unchanged.
diag = ["tauri/devtools"]

# No `panic = "abort"`: with it a panic anywhere — a russh parse error on one
# odd server, a bad import — killed every open session at once with no message
# (the release build has no console). Unwinding keeps a panic inside the task
# that hit it, and applog.rs records it.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
